[settings]
idiomatic_version_file_enable_tools = ["go"]

[env]
GOTOOLCHAIN = "local"

[tasks.test]
description = "Run tests"
run = "go test ./..."

[tasks.build]
description = "Build the pco-dl command"
run = 'CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o bin/pco-dl ./cmd/pco-dl'

[tasks.lint]
description = "Lint Go and GitHub Actions"
run = "golangci-lint run ./... && jactionlint"

[tasks.updates]
description = "Fail when a pinned action has a release older than seven days"
run = "jactionlint update --check"

[tasks.vuln]
description = "Scan for known vulnerabilities"
run = "GOTELEMETRY=off go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./..."

[tasks.fmt]
description = "Format Go code"
run = "go fmt ./..."

[tools]
"github:jdx/jactionlint" = "2.6.0"
golangci-lint = "2.15.0"
shellcheck = "0.11.0"
